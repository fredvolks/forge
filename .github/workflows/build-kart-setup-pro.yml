name: Kart Setup Pro APK
on:
  push:
    branches: [kart-setup-pro]
    paths: ['kart-setup-pro/**', '.github/workflows/build-kart-setup-pro.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build Android APK
        working-directory: kart-setup-pro
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kart-setup-pro-debug
          path: kart-setup-pro/app/build/outputs/apk/debug/app-debug.apk
