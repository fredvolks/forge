name: Compiler Correcteur Perso APK
on:
  push:
    branches: 
      - build/correcteur-perso-android-v01
    paths-ignore:
      - 'releases/**'
  workflow_dispatch:
jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Tests du correcteur et compilation APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Autoriser la virtualisation KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/upload-artifact@v4
        with:
          name: CorrecteurPerso-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publier APK dans cette branche seulement
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/CorrecteurPerso-v0.3-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/CorrecteurPerso-v0.3-debug.apk
          git commit -m "build: ajouter APK Correcteur Perso v0.3" || exit 0
          git push origin HEAD:build/correcteur-perso-android-v01

      - name: Tests clavier réel en émulateur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            gradle --no-daemon :app:installDebug
            adb shell ime enable ca.correcteur.perso/.PersonalKeyboardService
            adb shell ime set ca.correcteur.perso/.PersonalKeyboardService
            adb logcat -c
            bash -c 'gradle --no-daemon :app:connectedDebugAndroidTest; status=$?; echo "===== AndroidRuntime crash report ====="; adb logcat -d -v time | grep -A 24 -E "FATAL EXCEPTION|AndroidRuntime|ca.correcteur.perso|Fatal signal" | tail -n 200 || true; echo "===== InputMethodService state ====="; adb shell dumpsys input_method | tail -n 45; exit $status'

