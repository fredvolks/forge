/* Historique des laps : feuille distincte pour préserver les 4 chronos à l'écran */
.lap-history-modal{max-height:91dvh;display:flex;flex-direction:column;overflow:hidden;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.lap-history-modal h2{margin:2px 0 2px;font-size:23px;letter-spacing:-.035em}
.lap-history-modal .hist-tabs{display:flex;gap:6px;overflow-x:auto;flex:none;padding:4px 0 8px;scrollbar-width:thin}
.hist-tabs .chip{white-space:nowrap;min-height:35px;padding:8px 10px;flex-shrink:0}
.hist-scopes{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:3px;border-radius:11px;border:1px solid #38506a;background:#101c2c;margin-bottom:8px;flex:none}
.hist-scopes button{border:0;border-radius:8px;padding:8px 5px;background:none;color:#9db1c7;font-size:11px;font-weight:800}
.hist-scopes button.active{background:#28425a;color:#d6f5ff}
.hist-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:9px;flex:none}
.hist-stat{padding:10px 5px;background:#102134;border:1px solid #2d465e;border-radius:12px;text-align:center;min-width:0}
.hist-stat small{display:block;color:#a3b6cc;font-size:9px;font-weight:800;letter-spacing:.02em}
.hist-stat strong{display:block;font-size:clamp(12px,3.4vw,18px);font-variant-numeric:tabular-nums;color:#f7f9fc;margin-top:4px;white-space:nowrap}
.hist-counter{font-size:11px;color:#99b7cb;margin-bottom:7px;flex:none}
.hist-list{overflow-y:auto;overscroll-behavior:contain;min-height:88px;max-height:46dvh;border:1px solid #31465b;border-radius:13px;background:#0f1a28;flex:1}
.hist-entry{display:grid;grid-template-columns:minmax(0,1.05fr) auto 64px;gap:8px;align-items:center;padding:10px 10px;border-bottom:1px solid #27394b}
.hist-entry:last-child{border-bottom:0}
.hist-entry strong{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-entry small{font-size:9px;color:#9badc2;display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-laptime{font-weight:900;font-size:14px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.hist-laptime.best{color:var(--green)}
.hist-delta{font-size:11px;color:#b1c2d7;font-weight:800;text-align:right;white-space:nowrap}
.hist-delta.best{color:var(--green)}
.hist-note{font-size:10px;color:#9eafc3;line-height:1.4;margin:8px 0 0;flex:none}
@media(max-width:360px){.chrono-control button{font-size:9px}.hist-entry{padding:8px;gap:5px;grid-template-columns:minmax(0,1fr) auto 55px}.hist-laptime{font-size:12px}.lap-history-modal{padding:15px 11px 9px}}


/* Chrono v2.3: target always lower-right, the entire card is one big LAP action. */
.chrono-grid .stop-card{cursor:pointer;touch-action:manipulation;position:relative;transition:border-color .14s ease,background .14s ease;user-select:none;-webkit-user-select:none}
.chrono-grid .stop-card:focus-visible{outline:3px solid #81eaf4;outline-offset:-3px}
.chrono-grid .stop-card.priority{border:2px solid #ffc76c;background:linear-gradient(160deg,#2d3541,#192639);box-shadow:inset 0 0 0 1px #ffc76c36,0 0 13px #ffb75a22}
.chrono-grid .stop-card.priority .lap-hint{color:#ffe295;font-weight:900}
.chrono-grid .stop-card.running::after{content:'TOUCHER = LAP';pointer-events:none;position:absolute;bottom:7px;left:10px;font-size:8px;font-weight:900;color:#f8b18f;letter-spacing:.05em}
.chrono-grid .stop-card.priority.running::after{color:#ffdf95}
.stop-btns{display:flex;justify-content:flex-end;align-items:center;min-height:38px;padding-bottom:3px}
.stop-btns button{min-width:58px;max-width:72px;height:35px;font-size:11px;position:relative;z-index:2}
.stop-card:active:not(.is-stopped){background:#30405a}
@media(max-height:720px){.chrono-grid .stop-card.running::after{font-size:7px;bottom:3px}.stop-btns button{height:30px}.stop-btns{min-height:34px}}

<body>
<div class="shell"><header class="appbar" id="bar"></header><main id="app"></main><nav class="nav" id="nav" aria-label="Navigation principale"></nav></div><div id="modal-root"></div><div id="toast-root"></div>
<script>
if(Date.now() > Date.parse("2026-10-17T03:59:59Z")) { document.body.innerHTML='<main style="font:18px system-ui;background:#090e16;color:#fff;min-height:100vh;padding:40px 20px"><h1>Essai terminé</h1><p>Le lien temporaire KART SETUP PRO est expiré.</p></main>'; } else {

(function(){'use strict';
const KEY='kart_setup_pro_local_v2_2026';
const CIRCUITS=['Mirabel','Québec','SH','Mont-Tremblant (sens 1)','Mont-Tremblant (sens inverse)','SC Performance','Trois-Rivières','Château-Richer'];

const GEAR_RANGES={sec:[0,0],humide:[0,1],faible:[1,2],moyenne:[2,4],forte:[3,6]};
const DEFAULT_SETUP={frontHeight:'Milieu',rearHeight:'Milieu',frontSpacersL:1.5,frontSpacersR:1.5,spacersLinked:true,rearWidth:139,caster:'0.5',camber:'',axle:'F',seat:'T11VG',rims:'Freeline',seatBars:2,frontBar:true,sprocket:12,crown:76,notes:''};
const DEFAULT_CARBU={jet:126,needle:'K57',clip:3,airScrew:1.75,floatL:3.5,floatR:3.5,floatWeight:'4,0',floatGauge:'non_verifie',notes:''};
const DEFAULT_TIRES={FL:{cold:'',hot:'',ir:'',hotIR:''},FR:{cold:'',hot:'',ir:'',hotIR:''},RL:{cold:'',hot:'',ir:'',hotIR:''},RR:{cold:'',hot:'',ir:'',hotIR:''},trackTemp:''};
const DEFAULTS={engineProfile:'senior',enginePumps:{junior:'Mikuni',senior:'Dellorto',dd2:'Dellorto'},jetWeatherReferences:{},jetWeatherReference:null,uniproAssignments:null,uniproError:null,uniproTransfer:null,uniproLastRead:null,track:'Mirabel',trackState:'sec',circuits:{},pilots:[{name:'Jacob',num:'27'},{name:'Pilote 2',num:'2'},{name:'Pilote 3',num:'3'},{name:'Pilote 4',num:'4'}],lead:3,laps:[],sessions:[],weather:null,weatherCoords:{},autoGps:false,weatherCities:{}};
function clone(x){return JSON.parse(JSON.stringify(x))}
let state=clone(DEFAULTS);
try{const obj=JSON.parse(localStorage.getItem(KEY)||'null');if(obj&&typeof obj==='object'){state={...state,...obj};}}catch(e){console.warn('État local illisible',e)}

const ENGINES={junior:'Junior MAX EVO',senior:'Senior MAX EVO',dd2:'DD2 EVO'};
function engineId(){return ENGINES[state.engineProfile]?state.engineProfile:'senior'}
function engineName(){return ENGINES[engineId()]}
function pumpName(){return engineId()==='junior'?'Mikuni':state.enginePumps?.[engineId()]||'Dellorto'}
function initTrack(name){
 if(!state.circuits[name])state.circuits[name]={setup:clone(DEFAULT_SETUP),carbu:clone(DEFAULT_CARBU),tires:clone(DEFAULT_TIRES),updatedAt:null,history:[]};
 const c=state.circuits[name];
 c.setup={...clone(DEFAULT_SETUP),...(c.setup||{})};
 c.tires={...clone(DEFAULT_TIRES),...(c.tires||{})};
 if(!c.carbuProfiles)c.carbuProfiles={junior:{...clone(DEFAULT_CARBU),jet:''},senior:{...clone(DEFAULT_CARBU),...(c.carbu||{})},dd2:{...clone(DEFAULT_CARBU),jet:''}};
 for(const id of Object.keys(ENGINES))c.carbuProfiles[id]={...clone(DEFAULT_CARBU),...(c.carbuProfiles[id]||{})};
 c.carbu=c.carbuProfiles[engineId()];
 return c;
}
function selectEngine(id){if(!ENGINES[id])return;state.engineProfile=id;initTrack(state.track);save();render();notify(ENGINES[id]+' actif')}
function selectPump(pump){
 if(!['Mikuni','Dellorto'].includes(pump))return;
 if(engineId()==='junior'){notify('Junior : pompe Mikuni obligatoire (RMC 2026)');return}
 state.enginePumps={...(state.enginePumps||{}),[engineId()]:pump};save();render();
}
function engineSelector(){
 const active=engineId();
 return '<div class="panel" style="margin:10px 0"><div class="setting-title"><h3>Profil moteur</h3><span>3 CONFIGURATIONS</span></div>'+
 '<div class="engine-switch">'+Object.entries(ENGINES).map(([id,name])=>'<button data-engine="'+id+'" class="engine-chip '+(active===id?'engine-active':'')+'"><b>'+esc(name)+'</b><small>'+(active===id?'● SÉLECTIONNÉ':'CHOISIR')+'</small></button>').join('')+'</div>'+
 '<div class="subtext" style="margin-top:11px">Dell’Orto VHSB 34 XS · pompe '+esc(pumpName())+'</div>'+
 (active==='junior'?'<p class="subtext">Pompe Mikuni obligatoire selon RMC 2026.</p>':
 '<div class="btn-row" style="margin-top:9px"><button class="btn compact '+(pumpName()==='Dellorto'?'primary':'outline')+'" data-pump="Dellorto">Dell’Orto</button><button class="btn compact '+(pumpName()==='Mikuni'?'primary':'outline')+'" data-pump="Mikuni">Mikuni</button></div>')+
 '<p class="subtext" style="margin-top:10px">La marque de pompe ne change pas automatiquement le jet : contrôler son débit, la membrane et les durites si la cuve se vide.</p></div>';
}

CIRCUITS.forEach(initTrack);
state.weatherCities=state.weatherCities||{};
let page='home',modal=null,dirty=false,toastTimer=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtNum=n=>Number(n).toLocaleString('fr-CA',{maximumFractionDigits:1});

function current(){return initTrack(state.track)}
function pageHeader(name,desc){return `<div class="eyebrow">${esc(state.track)} • Birel ART S8</div><h1 class="section-title">${name}</h1><div class="subtext">${desc}</div>`}
function appNav(){const pages=[['home','Accueil','flag'],['setup','Setup','wrench'],['carbu','Carbu','gauge'],['circuits','Circuits','pin'],['chrono','Chrono','timer']];$('#nav').innerHTML=pages.map(([key,n,ico])=>`<button type="button" class="navbtn ${page===key?'active':''}" data-nav="${key}" aria-label="${n}" aria-current="${page===key?'page':'false'}">${svg(ico)}<span>${n}</span></button>`).join('')}
function appBar(){const active=page==='chrono'?'CHRONO':page==='carbu'?'CARBURATION':page==='setup'?'SETUP':'COURSE';$('#bar').innerHTML=`<div class="brand"><div class="mark">K</div><div><div class="brand-name">KART SETUP <span style="color:#ff865c">PRO</span></div><div class="brand-sub">${active} • OFFLINE READY</div></div></div><button class="head-action" data-modal="options" title="Options et sauvegarde">${svg('settings')}<span>Options</span></button>`}
function label(value){return TRACKSTATES.find(x=>x[0]===value)?.[1]||'Sec'}
function weatherData(){return state.weather&&state.weather.lat!=null&&state.weather.track===state.track?state.weather:null}
function weatherAge(w){if(!w)return 'Non chargée';const min=Math.max(0,Math.round((Date.now()-w.timestamp)/60000));return min<1?'À l’instant':min<60?`Il y a ${min} min`:`Il y a ${Math.round(min/60)} h`}
function weatherStrip(){const w=weatherData();return `<div class="weather-strip"><div class="weather-bit"><strong>${w?esc(w.temp)+'°':'—'}</strong><span>Air · °C</span></div><div class="weather-bit"><strong>${w?esc(w.humidity)+'%':'—'}</strong><span>Humidité</span></div><div class="weather-bit"><strong>${w?esc(w.rain)+' mm':'—'}</strong><span>Pluie / heure</span></div></div>`}
function miniWeather(){const w=weatherData();return `<div class="wx-gauges"><div class="wx-cell"><b>${w?esc(w.temp)+' °C':'—'}</b><span>Température air</span></div><div class="wx-cell"><b>${w?esc(w.humidity)+' %':'—'}</b><span>Humidité relative</span></div><div class="wx-cell"><b>${w?esc(w.pressure)+' hPa':'—'}</b><span>Pression surface</span></div><div class="wx-cell"><b>${w?esc(w.seaPressure)+' hPa':'—'}</b><span>Pression niveau mer</span></div></div>`}
function home(){const w=weatherData();return `<div class="content">
<div class="panel hero"><div class="row spread"><span class="pill live">${svg('pin',13)} CIRCUIT ACTIF</span><span class="pill">${w?(w.source==='GPS'?'GPS':'MÉTÉO CIRCUIT'):'MODE LOCAL'}</span></div><div class="big-track">${esc(state.track)}</div><div class="subtext">${w?`Open-Meteo · ${weatherAge(w)} · ${esc(w.source==='GPS'?'Position du téléphone':w.source||'Circuit sélectionné')}`:'Prêt pour ta prochaine séance au circuit'}</div>${weatherStrip()}<div class="btn-row"><button class="btn primary" data-action="track-weather">${svg('weather')} Météo circuit</button><button class="btn secondary" data-action="gps-weather">${svg('location')} GPS</button></div></div>
<div class="block-heading"><h3>Ton garage de piste</h3><small>Un accès, un réglage</small></div><div class="action-grid"><button class="action-tile" data-nav="setup"><span class="tile-icon">${svg('wrench')}</span><div><b>Setup châssis</b><br><small>Essieu, hauteurs, voies, banc</small></div></button><button class="action-tile" data-nav="carbu"><span class="tile-icon">${svg('gauge')}</span><div><b>Carburation</b><br><small>Jet, K57, flotte et météo</small></div></button><button class="action-tile" data-nav="circuits" data-sub="rain"><span class="tile-icon">${svg('weather')}</span><div><b>Rain Gear</b><br><small>État de piste et transmission</small></div></button><button class="action-tile" data-nav="tires"><span class="tile-icon">${svg('tire')}</span><div><b>Pneus / UniPro</b><br><small>PSI et températures IR</small></div></button></div>
<div class="block-heading"><h3>Acquisition de données</h3><button class="btn compact outline" data-nav="devices">Voir tout ${svg('chevron',14)}</button></div><div class="panel"><div class="device-line"><div class="row"><span class="dot"></span><div><strong>AiM MyChron 5</strong><small>Wi-Fi direct · import à développer</small></div></div><span class="pill">À connecter</span></div><div class="device-line"><div class="row"><span class="dot"></span><div><strong>UniPro UniTire V2 IR</strong><small>Bluetooth BLE · protocole à valider</small></div></div><span class="pill">À connecter</span></div></div>
<div class="block-heading"><h3>Journal de piste</h3><button class="btn compact outline" data-nav="sessions">Historique ${svg('chevron',14)}</button></div><div class="panel"><div class="row spread"><div><b style="font-size:14px">Tes réglages sauvegardés</b><div class="subtext">Localement sur cet appareil</div></div><span class="pill cyan">${state.sessions.length} séance${state.sessions.length>1?'s':''}</span></div><button class="btn full secondary" style="margin-top:13px" data-action="snapshot">${svg('check')} Enregistrer le setup actuel</button></div>
</div>`}
function seg(field,opts,area='setup'){const val=current()[area][field];return `<div class="seg">${opts.map(v=>`<button class="${String(val)===String(v)?'active':''}" data-set="${area}.${field}" data-value="${esc(v)}">${esc(v)}</button>`).join('')}</div>`}
function chips(field,opts,area='setup'){const val=current()[area][field];return `<div class="select-row">${opts.map(([v,t])=>`<button class="chip ${String(val)===String(v)?'selected':''}" data-set="${area}.${field}" data-value="${esc(v)}">${esc(t)}</button>`).join('')}</div>`}
function numInput(area,field,labelText,opts=''){const val=current()[area][field];return `<div class="field"><label class="label" for="${area}_${field}">${labelText}</label><input id="${area}_${field}" data-input="${area}.${field}" value="${esc(val)}" ${opts} autocomplete="off"></div>`}
function setup(){const s=current().setup;return `<div class="content">${pageHeader('Réglage du kart','Tout se règle avec les repères utilisés au paddock.')}<div class="space"></div><div class="note warning">Configuration de départ : valide les valeurs du kart et enregistre un premier setup de référence pour ce circuit.</div><div class="space"></div>
<div class="panel"><div class="setting-title"><h3>Hauteur du châssis</h3><span>Positions physiques</span></div><div class="label">AVANT</div>${seg('frontHeight',['Bas','Milieu','Haut'])}<div class="tiny-space"></div><div class="label">ARRIÈRE</div>${seg('rearHeight',['Bas','Milieu','Haut'])}</div>
<div class="space"></div><div class="panel"><div class="setting-title"><h3>Largeur avant</h3><span>Bagues à l'intérieur</span></div><div class="diagram">${kartDiagram(s)}</div><div class="tiny-space"></div><label class="toggle"><input type="checkbox" data-check="setup.spacersLinked" ${s.spacersLinked?'checked':''}>Garder gauche et droite identiques</label><div class="field-grid" style="margin-top:12px"><div><div class="label">GAUCHE · nombre de bagues</div><div class="mini-step"><button data-step="frontSpacersL" data-delta="-0.5">−</button><output>${String(s.frontSpacersL).replace('.',',')}</output><button data-step="frontSpacersL" data-delta="0.5">+</button></div></div><div><div class="label">DROITE · nombre de bagues</div><div class="mini-step"><button data-step="frontSpacersR" data-delta="-0.5" ${s.spacersLinked?'disabled':''}>−</button><output>${String(s.frontSpacersR).replace('.',',')}</output><button data-step="frontSpacersR" data-delta="0.5" ${s.spacersLinked?'disabled':''}>+</button></div></div></div><p class="subtext">Pas de ½ bague : 1 · 1½ · 2 · 2½ ...</p></div>
<div class="space"></div><div class="panel"><div class="setting-title"><h3>Train arrière</h3><span>Mesure extérieure</span></div><div class="field-grid"><div>${numInput('setup','rearWidth','Largeur arrière (cm)','type="number" min="110" max="140" step="0.5" inputmode="decimal"')}</div><div><div class="label">Référence connue</div><div class="field-value">139 <span class="muted" style="font-size:12px">cm</span></div><div class="subtext">Limite habituelle 140 cm</div></div></div><div class="divider"></div><div class="label">Essieu Freeline · lettre gravée</div>${chips('axle',AXLES)}<div class="note" style="margin-top:10px">Codes constructeur : S très souple · B souple · F référence · M mi-dur · K dur. Vérifier les dimensions et le modèle exact.</div></div>
<div class="space"></div><div class="panel"><div class="setting-title"><h3>Banc et renforts</h3><span>Tillett / Freeline</span></div><div class="label">Banc</div>${chips('seat',[['T11T','T11T'],['T11VG','T11VG']])}<div class="tiny-space"></div><div class="field-grid"><div><div class="label">Barres de banc</div><div class="mini-step"><button data-step="seatBars" data-delta="-1">−</button><output>${s.seatBars}</output><button data-step="seatBars" data-delta="1">+</button></div></div><div><div class="label">Barre avant</div>${chips('frontBar',[[true,'Installée'],[false,'Retirée']])}</div></div><div class="divider"></div><div class="label">Jantes</div>${chips('rims',[['Freeline','Freeline'],['OTK MXC','OTK MXC']])}</div>
<div class="space"></div><div class="panel"><div class="setting-title"><h3>Géométrie</h3><span>Valeurs réelles</span></div><div class="field-grid">${numInput('setup','caster','Caster (°)','type="number" step="0.25" inputmode="decimal"')}${numInput('setup','camber','Carrossage (°)','type="number" step="0.25" inputmode="decimal"')}</div></div>
<div class="space"></div><div class="panel"><div class="setting-title"><h3>Transmission sèche</h3><span>Départ du Rain Gear</span></div><div class="field-grid">${numInput('setup','sprocket','Pignon moteur','type="number" min="10" max="18"')}${numInput('setup','crown','Couronne','type="number" min="60" max="99"')}</div><button class="btn full secondary" style="margin-top:12px" data-nav="circuits" data-sub="rain">Voir le Rain Gear Advisor ${svg('chevron')}</button></div>
<div class="space"></div><div class="panel"><div class="setting-title"><h3>Comportement en piste</h3><span>Diagnostic</span></div><div class="select-row" id="symptoms">${['Sous-virage lent','Arrière glisse en rapide','Manque de traction','Kart qui sautille','Manque de rotation'].map(x=>`<button data-symptom="${x}" class="chip ${state.symptoms?.includes(x)?'selected':''}">${x}</button>`).join('')}</div><div class="note warning" style="margin-top:12px">Les essais seront proposés un à la fois; jamais de correction automatique sans tenir compte de la piste, des pneus et des RPM.</div></div>
<div class="space"></div><button class="btn primary full" data-action="snapshot">${svg('check')} Enregistrer ce setup dans le journal</button></div>`}
function kartDiagram(s){return `<svg viewBox="0 0 320 170" role="img" aria-label="Schéma du kart, vue de dessus, largeur avant par bagues intérieures"><g stroke="#4f667d" fill="none" stroke-width="1.5"><path d="M145 10 130 22 116 64 120 123 143 153 177 153 200 123 204 64 190 22 175 10Z" fill="#243546"/><rect x="126" y="68" width="68" height="52" rx="21" fill="#192533"/><path d="M115 41h90M115 132h90" stroke-width="7" stroke="#718096"/><rect x="79" y="28" width="27" height="46" rx="8" fill="#080c14" stroke="#627a91" stroke-width="4"/><rect x="214" y="28" width="27" height="46" rx="8" fill="#080c14" stroke="#627a91" stroke-width="4"/><rect x="86" y="115" width="24" height="45" rx="8" fill="#080c14" stroke="#627a91" stroke-width="4"/><rect x="210" y="115" width="24" height="45" rx="8" fill="#080c14" stroke="#627a91" stroke-width="4"/><path d="M160 18v22m-13 0h26"/></g><path d="M107 50h16m74 0h16" stroke="#69dce9" stroke-width="5"/><text x="53" y="22" fill="#b9c9dd" font-size="10" text-anchor="middle">G</text><text x="268" y="22" fill="#b9c9dd" font-size="10" text-anchor="middle">D</text><text x="53" y="53" fill="#72deed" font-size="16" font-weight="bold" text-anchor="middle">${esc(String(s.frontSpacersL).replace('.',','))}</text><text x="268" y="53" fill="#72deed" font-size="16" font-weight="bold" text-anchor="middle">${esc(String(s.frontSpacersR).replace('.',','))}</text><text x="160" y="92" fill="#f28563" font-weight="bold" font-size="11" text-anchor="middle">BIREL</text></svg>`}

/* Comparateur météo du jet principal.
   Modèle simplifié : concentration relative d'air sec/oxygène ~ (P - e)/(T_K).
   Le diamètre nominal du gicleur est proportionnel à sqrt(correction de densité).
   CE N'EST PAS l'algorithme officiel ROTAX, ni une validation de sécurité moteur.
   Référence provisoire 126 à 20°C / 1013,25 hPa surface / 50% HR.
   Une référence sur moteur validée par l'utilisateur remplace cette hypothèse. */
const JET_DEMO_REFERENCE={jet:126,temp:20,humidity:50,pressure:1013.25,source:'hypothèse illustrative'};
const JET_SIZES=[122,124,125,126,128,130];
function jetSatVaporHpa(tempC){
 return 6.112*Math.exp(17.67*tempC/(tempC+243.5));
}
function jetRelativeOxygen(w){
 if(!w)return null;
 const t=Number(w.temp),h=Number(w.humidity),p=Number(w.pressure);
 if(!Number.isFinite(t)||!Number.isFinite(h)||!Number.isFinite(p)||t< -15||t>50||h<0||h>100||p<850||p>1100)return null;
 const pv=jetSatVaporHpa(t)*h/100,dry=p-pv;
 if(dry<=0)return null;
 return dry/(t+273.15);
}
function jetWeatherEstimate(weather,reference){
 const cur=jetRelativeOxygen(weather),ref=jetRelativeOxygen(reference);
 const jet=Number(reference.jet);
 if(cur==null||ref==null||!Number.isInteger(jet)||jet<90||jet>220)return null;
 const factor=Math.sqrt(cur/ref),raw=jet*factor;
 // Arrondi théorique à l’unité; la disponibilité réelle des jets et toute taille minimale de course doivent être vérifiées.
 const suggested=Math.round(raw);
 return {suggested,raw,change:raw-jet,oxygenPercent:(cur/ref-1)*100,
     outside:Math.abs(raw-jet)>6};
}

function jetWeatherAdvisor(w){
 const realRef=state.jetWeatherReferences?.[engineId()]||(engineId()==='senior'?state.jetWeatherReference:null);
 const ref=realRef||(engineId()==='senior'?JET_DEMO_REFERENCE:null);
 const age=w?Math.max(0,Date.now()-Number(w.timestamp)):Infinity;
 const fresh=age<=90*60000;
 const est=w&&fresh&&ref?jetWeatherEstimate(w,ref):null;
 let html='<div class="panel" id="jetadvisor"><div class="setting-title"><h3>Gicleur selon la météo</h3><span>'+(realRef?'TON RÉGLAGE ÉTALONNÉ':'ESTIMATION')+'</span></div>';
 if(!w)html+='<div class="note warning">Charge « Mon GPS » ou « Météo circuit » pour afficher une estimation de gicleur.</div>';
 else if(!fresh)html+='<div class="note warning">Météo trop ancienne ('+esc(weatherAge(w))+'). Recharge le GPS avant de calculer une nouvelle suggestion.</div>';
 else if(!ref)html+='<div class="note warning">Aucun jet suggéré pour '+esc(engineName())+' sans une référence validée sur ce moteur. Choisis ton jet et enregistre une référence réelle avec la météo.</div>';
 else if(!est)html+='<div class="note warning">Météo incomplète ou hors limites de calcul. Aucune suggestion chiffrée.</div>';
 else {
   const number=est.suggested;
   const qualifier=realRef?'Comparaison à ton gicleur de référence '+realRef.jet:'Simulation à partir du gicleur fictif 126';
   html+='<div style="padding:7px 0"><div class="subtext">'+esc(qualifier)+'</div>'+
    '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:10px 0"><strong style="font-size:54px;line-height:1;color:var(--accent2)">'+esc(number)+'</strong><div class="subtext">GICLEUR INDICATIF<br>'+esc((est.change>=0?'+':'')+est.change.toFixed(1))+' point(s) théoriques par rapport à '+esc(ref.jet)+'<br>Air sec/oxygène : '+esc((est.oxygenPercent>=0?'+':'')+est.oxygenPercent.toFixed(1))+' %</div></div></div>'+
    '<div class="note '+(est.outside?'warning':'')+'"><b>'+(realRef?'Estimation calibrée sur ta référence.':'Ce nombre est une simulation, PAS un jet validé pour ton moteur.')+'</b><br>Calcul simplifié à partir de '+esc(w.temp)+' °C, '+esc(w.humidity)+' % HR et '+esc(w.pressure)+' hPa <b>à la surface</b>. '+(est.outside?'Le résultat est éloigné de la référence validée (plus de 6 points). Ne pas l’appliquer sans vérifier directement le moteur et le règlement de l’épreuve.':'')+'<br>Ce calcul n’est pas la table officielle Rotax : contrôle avec le guide constructeur, le comportement du moteur et un préparateur si nécessaire.</div>';
   if(realRef)html+='<button class="btn primary full" style="margin-top:10px" data-action="jet-apply">COPIER '+esc(number)+' DANS MON SETUP</button>';
 }
 html+='<div class="divider"></div><b>Gicleur de référence personnel · '+esc(engineName())+'</b>';
 if(realRef){
  html+='<div class="subtext" style="margin:8px 0">Jet '+esc(realRef.jet)+' · '+esc(realRef.temp)+' °C · '+esc(realRef.humidity)+' % · '+esc(realRef.pressure)+' hPa · enregistré le '+esc(new Date(realRef.savedAt).toLocaleDateString('fr-CA'))+'</div>';
  html+='<button class="btn outline full" data-action="jet-reference-reset">REMPLACER / EFFACER LA RÉFÉRENCE</button>';
 }else{
  html+='<p class="subtext">Pour obtenir une suggestion adaptée à <b>ton Rotax Senior EVO</b>, règle d’abord le gicleur réellement validé dans « Main jet », charge la météo et enregistre ce couple comme référence.</p>';
  html+='<button class="btn secondary full" data-action="jet-reference-save" '+(!w||!fresh?'disabled':'')+'>ENREGISTRER MON JET VALIDÉ COMME RÉFÉRENCE</button>';
 }
 html+='<div class="subtext" style="margin-top:12px">Pour modifier les réglages manuellement, fais défiler plus bas : sections « Aiguille et clip » et « Vis d’air ».</div></div>';
 return html;
}
function jetSaveReference(){
 const weather=weatherData(),age=weather?Date.now()-Number(weather.timestamp):Infinity;
 if(!weather||age>90*60000){notify('Charge une météo récente avant de confirmer la référence');return}
 const ref={jet:Number(current().carbu.jet),temp:Number(weather.temp),humidity:Number(weather.humidity),pressure:Number(weather.pressure)};
 if(jetRelativeOxygen(ref)===null||!Number.isInteger(ref.jet)||ref.jet<90||ref.jet>220){notify('Jet ou météo non valide');return}
 if(!confirm('Tu confirmes que le gicleur '+ref.jet+' a déjà été validé sur ton moteur, avec une météo comparable ?\\n\\nCette confirmation sert uniquement de référence personnelle. Elle ne remplace pas les recommandations Rotax.'))return;
 state.jetWeatherReferences={...(state.jetWeatherReferences||{}),[engineId()]:{...ref,source:weather.source,track:state.track,savedAt:new Date().toISOString()}};
 save();render();notify('Référence enregistrée : jet '+ref.jet);
}
function jetResetReference(){
 if(!confirm('Effacer la référence enregistrée ? Le calcul reviendra à une simulation illustrative.'))return;
 state.jetWeatherReferences={...(state.jetWeatherReferences||{}),[engineId()]:null};if(engineId()==='senior')state.jetWeatherReference=null;save();render();notify('Référence effacée');
}
function jetApplySuggestion(){
 const w=weatherData(),ref=state.jetWeatherReferences?.[engineId()]||(engineId()==='senior'?state.jetWeatherReference:null);
 if(!ref||!w||Date.now()-Number(w.timestamp)>90*60000){notify('Référence et météo récente nécessaires');return}
 const result=jetWeatherEstimate(w,ref);if(!result){notify('Estimation indisponible');return}
 if(result.outside){notify('Hors plage habituelle : vérifier avec Rotax avant de choisir');return}
 const jet=result.suggested;
 if(!confirm('Noter le gicleur indicatif '+jet+' dans la fiche de setup ?\\n\\nCela NE change PAS la carburation physique du kart. Vérifie le réglage selon les consignes Rotax.'))return;
 current().carbu.jet=jet;changed();render();notify('Gicleur '+jet+' noté dans le setup');
}

function jetInsight(w){
if(!w)return '<div class="note" style="margin-top:11px">Active la météo GPS pour retrouver une séance comparable et observer le sens des corrections.</div>';
const candidates=state.sessions.filter(s=>s.track===state.track&&(s.engine===engineId()||(!s.engine&&engineId()==='senior'))&&s.weather&&Number.isFinite(Number(s.weather.temp))&&Number.isFinite(Number(s.carbu?.jet)));
if(!candidates.length)return '<div class="note" style="margin-top:11px">Première météo enregistrée : sauvegarde tes séances pour que l’assistant puisse comparer de vraies conditions avec tes main jets habituels.</div>';
const score=s=>Math.abs(w.temp-s.weather.temp)/8+Math.abs(w.humidity-s.weather.humidity)/25+Math.abs(w.pressure-s.weather.pressure)/10;
const match=candidates.slice().sort((a,b)=>score(a)-score(b))[0];
const t=w.temp-match.weather.temp,h=w.humidity-match.weather.humidity,p=w.pressure-match.weather.pressure;
let lines=[];
if(Math.abs(t)>=2)lines.push(t>0?'Air plus chaud : tendance jet ↓':'Air plus froid : tendance jet ↑');
if(Math.abs(h)>=5)lines.push(h>0?'Humidité plus élevée : tendance jet ↓':'Humidité plus faible : tendance jet ↑');
if(Math.abs(p)>=2)lines.push(p>0?'Pression plus élevée : tendance jet ↑':'Pression plus faible : tendance jet ↓');
return `<div class="note" style="margin-top:11px"><b class="light">Dernière référence météo comparable : jet ${esc(match.carbu.jet)}</b><br>${esc(match.weather.temp)} °C · ${esc(match.weather.humidity)} % HR · ${esc(match.weather.pressure)} hPa<br>${lines.length?lines.map(esc).join('<br>'):'Conditions proches de la référence.'}<br><i>Comparer les tendances ensemble. Aucun nouveau jet calculé automatiquement sans étalonnage.</i></div>`;
}

function carbOxygenMetrics(w){
 const i=jetRelativeOxygen(w);if(i==null)return null;
 const T=Number(w.temp),humidity=Number(w.humidity)/100, P=Number(w.pressure);
 const e=jetSatVaporHpa(T)*humidity,paDry=(P-e)*100,paVapor=e*100,kelvin=T+273.15;
 const R=8.314462618;
 const oxygenGm3=paDry/R/kelvin*0.20946*31.9988;
 const moistDensity=(paDry*.0289652+paVapor*.01801528)/(R*kelvin);
 return {pDry:P-e,pVapor:e,oxygenGm3,moistDensity};
}
function carbPhysicalAnalysis(w){
 const m=carbOxygenMetrics(w);
 let out='<details class="technical-panel" style="margin-top:14px"><summary style="font-weight:800;cursor:pointer">ANALYSE PHYSIQUE · OXYGÈNE / DÉBITS</summary><div class="divider"></div>';
 if(m){
  out+='<div class="field-grid" style="gap:10px"><div><div class="label">Oxygène volumique calculé</div><b style="font-size:25px;color:#8be7ff">'+esc(m.oxygenGm3.toFixed(1))+' g/m³</b></div>'+
  '<div><div class="label">Masse volumique air humide</div><b style="font-size:25px;color:#8be7ff">'+esc(m.moistDensity.toFixed(3))+' kg/m³</b></div></div>'+
  '<div class="subtext" style="margin-top:7px">Pression partielle air sec : '+esc(m.pDry.toFixed(1))+' hPa · Vapeur d’eau : '+esc(m.pVapor.toFixed(1))+' hPa.</div>';
 }else out+='<p class="subtext">Charge une météo GPS complète pour les valeurs calculées.</p>';
 out+='<div class="divider"></div>'+
 '<p class="subtext"><b>1 · Air :</b> pression partielle sèche = pression surface − humidité × pression de vapeur saturante. Les masses volumiques sont calculées avec la loi des gaz parfaits.</p>'+
 '<p class="subtext"><b>2 · Main jet :</b> N_théorique = N_référence × √(O₂_actuel/O₂_référence). <b>Ce rapport simplifié n’est pas une loi de débit certifiée Dell’Orto.</b> Il ne peut prédire à lui seul la puissance.</p>'+
 '<p class="subtext"><b>3 · K57 :</b> aire annulaire A = π(D_DP267² − d_K57(h)²)/4. Il manque les dimensions du cône K57, le niveau de boisseau et la dépression pour prédire le débit selon les cinq positions.</p>'+
 '<p class="subtext"><b>4 · Vis d’air :</b> Q_air ≈ Cd × A(tours) × √(2ΔP/ρ_air). La géométrie du pointeau et ΔP ne sont pas mesurées. Il serait faux de sortir une valeur optimale météo.</p>'+
 '<p class="subtext"><b>5 · Cuve :</b> le niveau d’essence influence la charge hydrostatique aux gicleurs, mais doit respecter le gabarit Rotax 277400. Pompe et cuve relèvent aussi de l’alimentation.</p>'+
 '<div class="note warning" style="margin-top:8px"><b>Confiance :</b> physique de l’air calculable; gicleur estimé avec référence expérimentée; vis et clip non calculables sans mesures supplémentaires. Aucun modèle de course validé n’est présenté comme optimum.</div></details>';
 return out;
}

const UNITIRE_SERVICE='b81b1206-eee6-4a3d-87ef-4d0011b0efff';
const UNITIRE_READ='b81b1207-eee6-4a3d-87ef-4d0011b0efff';
async function readUniPro(){
 if(!window.isSecureContext||!navigator.bluetooth){notify('UniPro : ouvre le lien HTTPS dans Chrome Android');return;}
 let device;
 const rows=[];
 try{
  device=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'UNITIRE_'},{namePrefix:'UniTire_'}],optionalServices:[UNITIRE_SERVICE]});
  const gatt=await device.gatt.connect();
  const service=await gatt.getPrimaryService(UNITIRE_SERVICE);
  const characteristic=await service.getCharacteristic(UNITIRE_READ);
  for(let i=0;i<5;i++){
   const value=await characteristic.readValue();
   const data=new Uint8Array(value.buffer,value.byteOffset,value.byteLength);
   rows.push({index:i+1,ms:Math.round(performance.now()),length:data.length,hex:Array.from(data,b=>b.toString(16).padStart(2,'0')).join(' ').toUpperCase()});
   if(i<4)await new Promise(resolve=>setTimeout(resolve,350));
  }
  const name=device.name||'UniTire';
  state.uniproLastRead={name,at:new Date().toISOString(),hex:rows.at(-1).hex,length:rows.at(-1).length};
  state.uniproDiagnostic={device:name,at:new Date().toISOString(),service:UNITIRE_SERVICE,readCharacteristic:UNITIRE_READ,mode:'lecture-seule',reads:rows};
  save();render();
  const unique=new Set(rows.map(r=>r.hex));
  notify('UniPro : 5 lectures reçues · '+unique.size+' valeur(s) distincte(s)');
 }catch(e){
  if(rows.length){state.uniproDiagnostic={device:device?.name||'UniTire',at:new Date().toISOString(),mode:'lecture-seule',reads:rows,error:String(e.message||e)};save();render();}
  notify('UniPro : '+(e.name==='NotFoundError'?'appareil non choisi':e.message||'lecture indisponible'));
 }finally{try{if(device?.gatt?.connected)device.gatt.disconnect()}catch(e){}}
}

}


const UNITIRE_WRITE='b81b1208-eee6-4a3d-87ef-4d0011b0efff';
function decodeUniProPacket(bytes){
 const a=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes);
 const start=a.length%44;
 if(a.length<44||start>3)throw Error('Longueur inattendue : '+a.length);
 const sides=['FR','FL','RL','RR'],out=[];
 for(let i=start;i<a.length;i+=44){
  const q=a.subarray(i,i+44);
  if(q.length!==44||q[6]!==255||q[7]!==255||q[0]>23||q[1]>59||q[2]>59||q[3]<1||q[3]>31||q[4]<1||q[4]>12)throw Error('Entête UniTire non reconnu');
  const view=new DataView(q.buffer,q.byteOffset,44),pressure={},temperature={};
  for(let j=0;j<4;j++){
   const p=view.getInt32(8+j*4,true)/1000,t=view.getInt32(24+j*4,true)/100;
   pressure[sides[j]]=p>=2&&p<=35?+p.toFixed(2):null;
   temperature[sides[j]]=t>=-40&&t<=120?+t.toFixed(1):null;
  }
  const track=view.getInt32(40,true)/100;
  out.push({clock:[q[3],q[4],2000+q[5]].map((v,j)=>j===2?v:String(v).padStart(2,'0')).join('/')+' '+[q[0],q[1],q[2]].map(v=>String(v).padStart(2,'0')).join(':'),signature:Array.from(q.slice(0,8),b=>b.toString(16).padStart(2,'0')).join(''),pressure,temperature,trackTemp:track>=-40&&track<=120?+track.toFixed(1):null});
 }
 return out;
}
function validUniProValue(v){return v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v))}
function uniproHasPressure(r){return ['FR','FL','RL','RR'].some(side=>validUniProValue(r.pressure?.[side]))}
function uniproHasIR(r){return ['FR','FL','RL','RR'].some(side=>validUniProValue(r.temperature?.[side]))}
async function uniproSync(){
 if(!window.isSecureContext||!navigator.bluetooth){notify('Ouvre le lien HTTPS dans Chrome Samsung');return}
 let d=null,packets=[],records=[];
 state.uniproError=null;
 try{
  d=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'UNITIRE_'},{namePrefix:'UniTire_'}],optionalServices:[UNITIRE_SERVICE]});
  const svc=await (await d.gatt.connect()).getPrimaryService(UNITIRE_SERVICE);
  const rd=await svc.getCharacteristic(UNITIRE_READ),wr=await svc.getCharacteristic(UNITIRE_WRITE);
  if(typeof wr.writeValueWithResponse!=='function')throw Error('Chrome ne prend pas en charge les commandes BLE avec réponse');
  // Ces seules commandes de consultation ont été observées sur le transfert officiel.
  // NE PAS envoyer 0A (rôle non établi), de commandes firmware, DFU ou effacement.
  for(const cmd of [8,9]){
   await wr.writeValueWithResponse(new Uint8Array([cmd]));
   const view=await rd.readValue(),bytes=new Uint8Array(view.buffer,view.byteOffset,view.byteLength);
   packets.push({cmd,length:bytes.length,hex:Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join(' ').toUpperCase()});
   try{records.push(...decodeUniProPacket(bytes))}catch(e){packets.at(-1).decodeError=String(e.message||e)}
  }
  const unique=new Set();
  records=records.filter(rec=>{const key=rec.signature+JSON.stringify(rec.pressure)+JSON.stringify(rec.temperature);if(unique.has(key))return false;unique.add(key);return true});
  state.uniproTransfer={track:state.track,device:d.name||'UniTire',at:new Date().toISOString(),records,packets};
  save();render();
  notify(records.length?records.length+' relevé(s) lus. Vérifie les mesures avant de classer.':'Aucun relevé reconnu. Aucun pneu modifié.');
 }catch(e){
  state.uniproError=String(e.message||'Connexion impossible');
  if(packets.length){state.uniproTransfer={track:state.track,device:d?.name||'UniTire',at:new Date().toISOString(),records,packets};}
  save();render();notify('UniPro : '+state.uniproError);
 }finally{try{if(d?.gatt?.connected)d.gatt.disconnect()}catch(e){}}
}

function uniproAssign(action){
 const [pos,phase]=action.split(':'),t=state.uniproTransfer,r=t?.records?.[Number(pos)];
 if(!r||t.track!==state.track){notify('Ce relevé ne correspond pas au circuit sélectionné');return}
 if(phase!=='ir'&&!uniproHasPressure(r)){notify('Aucune pression dans ce relevé');return}
 if(phase==='ir'&&!uniproHasIR(r)){notify('Aucune température IR dans ce relevé');return}
 const dest=current().tires;
 const assignments=state.uniproAssignments||{};
 let count=0;
 for(const side of ['FR','FL','RL','RR']){
  if(phase==='ir'){
   if(validUniProValue(r.temperature[side])){dest[side].hotIR=r.temperature[side];count++}
  }else if(validUniProValue(r.pressure[side])){
   dest[side][phase==='avant'?'cold':'hot']=r.pressure[side];count++;
  }
 }
 if(phase==='ir'&&validUniProValue(r.trackTemp)){dest.trackTemp=r.trackTemp;count++}
 assignments[phase]={signature:r.signature||'',clock:r.clock||'',importedAt:new Date().toISOString(),transferAt:t.at};
 state.uniproAssignments=assignments;
 changed();render();
 notify(count+' valeur(s) ajoutée(s) : '+(phase==='avant'?'AVANT':phase==='chaud'?'APRÈS':'IR APRÈS'));
}

function uniproAdviceLines(d){

 const rise=sides.filter(k=>validUniProValue(d[k].cold)&&validUniProValue(d[k].hot)).map(k=>({side:k,value:Number(d[k].hot)-Number(d[k].cold)}));
 const temps=sides.filter(k=>validUniProValue(d[k].hotIR)).map(k=>({side:k,value:Number(d[k].hotIR)}));
 const tips=[];
 if(rise.length){
  const med=rise.map(r=>r.value).sort((a,b)=>a-b);tips.push('Montée médiane des pressions : '+((med[Math.floor((med.length-1)/2)]+med[Math.floor(med.length/2)])/2).toFixed(2)+' PSI.');
  if(rise.length===4){
   const sorted=rise.slice().sort((a,b)=>a.value-b.value),gap=sorted[3].value-sorted[0].value;
   if(gap>0.8)tips.push('Gains inégaux ('+gap.toFixed(2)+' PSI) : vérifier '+named[sorted[0].side]+' et '+named[sorted[3].side]+', le délai de mesure et le comportement du kart, avant de modifier la pression AVANT.');
  }
 }else tips.push('Pressions AVANT et APRÈS manquantes pour calculer la montée.');
 if(temps.length===4){
  const sorted=temps.slice().sort((a,b)=>a.value-b.value),spread=sorted[3].value-sorted[0].value;
  if(spread>12)tips.push('Écart IR de '+spread.toFixed(1)+' °C entre '+named[sorted[0].side]+' et '+named[sorted[3].side]+'. Vérifier la prise de mesure immédiate après arrêt et les caractéristiques du circuit.');
  else tips.push('Températures IR relativement rapprochées (écart '+spread.toFixed(1)+' °C).');
 }else tips.push('Ajoute les 4 températures IR APRÈS pour analyser les écarts.');
 tips.push('Recommandations indicatives : les chronos et le comportement doivent confirmer tout changement de setup.');
 return tips;

/* Keep the earliest expected passage in slot 4 (lower right).
   Before the first recorded lap, use the order in which pilots started/passed:
   the earliest first touch is the most likely to be the first to return.
   Once lap times exist, use the absolute expected next-passage times. */
function predictedPassTime(r){const d=timerLapDuration(r);return r.status==='running'&&d!=null&&Number.isFinite(d)&&d>0?r.lastStart+d:null}
function orderedRunners(){
 const ids=[0,1,2,3];
 return ids.sort((a,b)=>{
  const ra=runners[a],rb=runners[b];
  const cat=r=>r.status==='stopped'?0:r.status==='ready'?1:2;
  if(cat(ra)!==cat(rb))return cat(ra)-cat(rb);
  // Until a runner has their first completed lap, keep them ahead of runners with predictions.
  if(ra.status==='running'&&rb.status==='running'&&(ra.laps.length===0)!==(rb.laps.length===0))return ra.laps.length===0?1:-1;
  const pa=predictedPassTime(ra),pb=predictedPassTime(rb);
  if((pa===null)!==(pb===null))return pa===null?-1:1;
  if(pa!==null&&pb!==null&&Math.abs(pa-pb)>1)return pb-pa;
  if(ra.status==='running'&&rb.status==='running'&&pa===null&&pb===null){
   // First pilot tapped/started stays at bottom-right until a better estimate exists.
   if(Math.abs(ra.started-rb.started)>1)return rb.started-ra.started;
   // When all timers started together, use first completed passages as tie-breaker.
   const ia=passes.indexOf(a),ib=passes.indexOf(b);
   if(ia!==ib){if(ia<0)return -1;if(ib<0)return 1;return ia-ib}
  }
  return a-b;
 });
}

}

// La météo de ville est un repli distinct du GPS: aucun circuit n'est "détecté" de cette façon.
const WEATHER_CITY={
 'Mirabel':'Mirabel','Québec':'Québec',
 'Mont-Tremblant (sens 1)':'Mont-Tremblant',
 'Mont-Tremblant (sens inverse)':'Mont-Tremblant',
 'Trois-Rivières':'Trois-Rivières','Château-Richer':'Château-Richer'
};
const WEATHER_APPROX={
 'Mirabel':{lat:45.681239,lon:-74.024948,source:'Secteur ICAR/SRA Mirabel (approx.)'}
};

async function trackWeather(){
  try {
    const pinned=state.weatherCoords[state.track];
    if(pinned){await weatherFetch(pinned,'Coordonnées du circuit mémorisées');return}
    const chosen=(state.weatherCities[state.track]||WEATHER_CITY[state.track]||'').trim();
    if(state.track==='Mirabel'&&(!state.weatherCities[state.track]||chosen==='Mirabel')) {
      await weatherFetch(WEATHER_APPROX.Mirabel,WEATHER_APPROX.Mirabel.source);return;
    }
    if(!chosen){modal='weather-place';render();notify('Choisis une ville pour ce circuit');return}
    const url=new URL('https://geocoding-api.open-meteo.com/v1/search');
    url.searchParams.set('name',chosen+', Québec');
    url.searchParams.set('countryCode','CA');url.searchParams.set('language','fr');url.searchParams.set('count','10');
    const resp=await fetch(url.toString());if(!resp.ok)throw Error('Géocodage HTTP '+resp.status);
    const result=await resp.json();
    const places=(result.results||[]).filter(x=>x.country_code==='CA');
    const place=places.find(x=>(x.admin1||'').toLowerCase().includes('québec')||(x.admin1||'').toLowerCase().includes('quebec'))||places[0];
    if(!place)throw Error('Ville introuvable. Choisir une autre localité.');
    await weatherFetch({lat:place.latitude,lon:place.longitude},'Ville de '+place.name+' (approx.)');
  }catch(e){notify('Météo du circuit indisponible : '+(e.message||'vérifie Internet'))}
}
function gpsCoords(){return new Promise((res,rej)=>{if(!navigator.geolocation){rej(Error('Géolocalisation indisponible'));return}navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy}),rej,{enableHighAccuracy:true,timeout:14000,maximumAge:10000})})}
async function weatherFetch(c,source){notify('Chargement des données météo…');const p=new URL('https://api.open-meteo.com/v1/forecast');p.searchParams.set('latitude',c.lat);p.searchParams.set('longitude',c.lon);p.searchParams.set('current','temperature_2m,relative_humidity_2m,surface_pressure,pressure_msl,rain,precipitation');p.searchParams.set('timezone','auto');p.searchParams.set('forecast_days','1');const resp=await fetch(p.toString());if(!resp.ok)throw Error('Réponse météo '+resp.status);const j=await resp.json(),w=j.current;if(!w)throw Error('Données météo manquantes');state.weather={track:state.track,lat:c.lat,lon:c.lon,timestamp:Date.now(),measuredAt:w.time,temp:w.temperature_2m,humidity:w.relative_humidity_2m,pressure:w.surface_pressure,seaPressure:w.pressure_msl,rain:w.rain,precipitation:w.precipitation,source};save();render();notify('Météo récupérée · Open-Meteo')}
async function gpsWeather(){if(!canUsePhoneGPS()){notify('Chrome bloque le GPS du fichier local. Météo du circuit chargée sans GPS.');await trackWeather();return}try{const c=await gpsCoords();let best=null;for(const [name,where] of Object.entries(state.weatherCoords)){if(where.manual)continue;const delta=Math.hypot((c.lat-where.lat)*111,(c.lon-where.lon)*111*Math.cos(c.lat*Math.PI/180));if(delta<2.0&&(!best||delta<best.delta))best={name,delta}}if(best&&state.track!==best.name){state.track=best.name;state.trackState='sec';notify('Circuit reconnu : '+best.name)}await weatherFetch(c,'GPS')}catch(e){const saved=state.weatherCoords[state.track];if(saved){try{await weatherFetch(saved,'Circuit enregistré');return}catch(x){}}notify('GPS non accessible : météo du circuit sans localisation');await trackWeather()}}
async function pinTrack(){if(!canUsePhoneGPS()){notify('Associer GPS nécessite un site HTTPS ou une app Android');return}try{const c=await gpsCoords();const choice=confirm(`Associer ta position actuelle au circuit « ${state.track} » ?\n\nÀ faire seulement lorsque tu es réellement au circuit.`);if(choice){state.weatherCoords[state.track]=c;save();render();notify('Position du circuit mémorisée')}}catch(e){notify('Position GPS indisponible')}}
function snapshot(){const title=prompt('Nom du setup / essai','Setup de référence');if(title===null)return;const p=current();const s={id:String(Date.now())+'_'+Math.random().toString(36).slice(2,5),at:new Date().toISOString(),title:title.trim()||'Setup de référence',engine:engineId(),fuelPump:pumpName(),track:state.track,state:label(state.trackState),setup:clone(p.setup),carbu:clone(p.carbu),tires:clone(p.tires),weather:weatherData()?clone(weatherData()):null};state.sessions.push(s);p.history.push({id:s.id,at:s.at,state:s.state,title:s.title});save();notify('Setup enregistré dans le journal');render()}
function restore(id){const s=state.sessions.find(x=>x.id===id);if(!s)return;const choice=confirm(`Rétablir le setup « ${s.title} » (${s.track}) ?\nCe changement écrasera les réglages actuels de ce circuit.`);if(!choice)return;const target=initTrack(s.track);target.setup=clone(s.setup);target.tires=clone(s.tires);state.track=s.track;if(s.engine&&ENGINES[s.engine])state.engineProfile=s.engine;target.carbuProfiles=target.carbuProfiles||{};target.carbuProfiles[engineId()]=clone(s.carbu);target.carbu=target.carbuProfiles[engineId()];save();navigate('setup');notify('Setup restauré')}
function exportData(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='kart-setup-pro-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Sauvegarde JSON créée')}
function timerAction(action,i){const now=performance.now();if(action==='all-start'){runners.forEach((r,j)=>{if(r.status==='ready')runners[j]={...r,status:'running',started:now,lastStart:now,elapsed:0,alerted:false,runId:new Date().toISOString()+'_'+j}});render();return}
if(i<0||i>3)return;const r=runners[i];if(action==='lap'){if(r.status==='ready'){runners[i]={...r,status:'running',started:now,lastStart:now,elapsed:0,alerted:false,runId:new Date().toISOString()+'_'+i};render();return}if(r.status==='running'){const lap=now-r.lastStart;if(lap<700)return;r.laps.push(lap);r.lastStart=now;r.alerted=false;passes=[i,...passes.filter(x=>x!==i)];state.laps.push({at:new Date().toISOString(),pilot:state.pilots[i].name,pilotNum:state.pilots[i].num,pilotIndex:i,runId:r.runId||null,lapNo:r.laps.length,timeMs:lap,track:state.track});if(state.laps.length>4000)state.laps=state.laps.slice(-4000);save();document.getElementById('last_'+i).textContent=formatMs(lap);document.getElementById('best_'+i).textContent=formatMs(Math.min(...r.laps));document.getElementById('hint_'+i).textContent='TOUR '+r.laps.length;const countEl=document.getElementById('lapcount_'+i);if(countEl)countEl.textContent=r.laps.length+' tours ›';updateChronoOrder();return}}
if(action==='stop'){if(r.status==='running'){r.elapsed=Math.max(0,now-r.lastStart);r.status='stopped'}else if(r.status==='stopped'){runners[i]={status:'ready',lastStart:0,started:0,elapsed:0,laps:[],alerted:false}}render()}}
function vibrate(){try{if(navigator.vibrate)navigator.vibrate([120,65,120])}catch(e){}}
function tick(){if(page!=='chrono'){return}updateChronoOrder();const nextId=orderedRunners()[3];const knownNext=runners[nextId].status==='running';const now=performance.now();runners.forEach((r,i)=>{const t=document.getElementById('time_'+i);if(!t)return;t.textContent=formatMs(displayedElapsed(r,now));const hint=document.getElementById('hint_'+i);const card=document.getElementById('card_'+i);if(r.status==='running'){const base=timerLapDuration(r),elapsed=now-r.lastStart;if(base!=null){const remain=base-elapsed;hint.textContent=remain>0?`PASSAGE ~ ${Math.ceil(remain/1000)} s`:'PASSAGE ATTENDU';if(!r.alerted&&base>(state.lead+1)*1000&&remain<=state.lead*1000&&remain>-1500){r.alerted=true;vibrate();card.classList.add('alert')}if(remain<-1500)card.classList.remove('alert')}else hint.textContent='PREMIER TOUR';if(i===nextId&&knownNext)hint.textContent='★ PROCHAIN · '+hint.textContent;}else if(r.status==='stopped'){hint.textContent='ARRÊTÉ'}else hint.textContent='PRÊT'})}
setInterval(tick,38);
document.addEventListener('click',async e=>{const b=e.target.closest('[data-engine],[data-pump],[data-clip-choice],[data-air-step],[data-float-status],[data-unipro-assign],[data-nav],[data-action],[data-modal],[data-history],[data-history-pilot],[data-history-scope],[data-set],[data-step],[data-lead],[data-wet],[data-timer],[data-symptom],[data-card-lap]');if(!b){if(e.target.matches('[data-dismiss]')){modal=null;render()}return}
if(b.dataset.uniproAssign!==undefined){uniproAssign(b.dataset.uniproAssign);return}if(b.dataset.history!==undefined){historyPilot=b.dataset.history;historyScope='track';modal='lap-history';render();return}
if(b.dataset.historyPilot!==undefined){historyPilot=b.dataset.historyPilot;render();return}
if(b.dataset.historyScope!==undefined){historyScope=b.dataset.historyScope;render();return}
if(b.dataset.nav){navigate(b.dataset.nav,b.dataset.sub||'');return}
if(b.dataset.modal){modal=b.dataset.modal;render();return}
if(b.dataset.clipChoice!==undefined){const n=Number(b.dataset.clipChoice);if(n>=1&&n<=5){current().carbu.clip=n;changed();render()}return}if(b.dataset.airStep!==undefined){const diff=Number(b.dataset.airStep);current().carbu.airScrew=Math.max(0,Math.min(6,+(Number(current().carbu.airScrew)+diff).toFixed(2)));changed();render();return}if(b.dataset.floatStatus!==undefined){current().carbu.floatGauge=b.dataset.floatStatus;changed();render();return}if(b.dataset.engine!==undefined){selectEngine(b.dataset.engine);return}if(b.dataset.pump!==undefined){selectPump(b.dataset.pump);return}if(b.dataset.set){const [a,f]=b.dataset.set.split('.');toggleSelect(a,f,b.dataset.value);return}
if(b.dataset.step){const f=b.dataset.step,s=current().setup;const n=Math.min(f==='seatBars'?4:6,Math.max(0,Number(s[f])+Number(b.dataset.delta)));s[f]=n;if(f==='frontSpacersL'&&s.spacersLinked)s.frontSpacersR=n;changed();render();return}
if(b.dataset.lead){state.lead=Math.min(15,Math.max(1,Number(state.lead)+Number(b.dataset.lead)));save();render();return}
if(b.dataset.wet){state.trackState=b.dataset.wet;save();render();return}
if(b.dataset.timer){timerAction(b.dataset.timer,Number(b.dataset.i));return}if(b.dataset.cardLap!==undefined){timerAction('lap',Number(b.dataset.cardLap));return}
if(b.dataset.symptom){state.symptoms=state.symptoms||[];const v=b.dataset.symptom;state.symptoms=state.symptoms.includes(v)?state.symptoms.filter(x=>x!==v):[...state.symptoms,v];save();render();return}
const action=b.dataset.action;if(action==='jet-rotax-base'){jetUseRotaxBase();return}if(action==='jet-reference-save'){jetSaveReference();return}if(action==='jet-reference-reset'){jetResetReference();return}if(action==='jet-apply'){jetApplySuggestion();return}if(action==='unipro-save'){await uniproSaveSession();return}if(action==='unipro-new'){uniproNewSession();return}if(action==='unipro-direct'){await uniproSync();return}if(action==='unipro-read'){await readUniPro();return}if(action==='unipro-copy'){copyUniProDiagnostic();return}if(action==='gps-weather'){await gpsWeather();return}if(action==='track-weather'){modal=null;render();await trackWeather();return}if(action==='save-weather-place'){const city=$('#weather-city')?.value.trim()||'';const latStr=$('#weather-lat')?.value.trim(),lonStr=$('#weather-lon')?.value.trim();state.weatherCities[state.track]=city;if(latStr||lonStr){const lat=Number(latStr),lon=Number(lonStr);if(!latStr||!lonStr||!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180){notify('Latitude / longitude invalides');return}state.weatherCoords[state.track]={lat,lon,manual:true};}else if(state.weatherCoords[state.track]?.manual){delete state.weatherCoords[state.track]};save();modal=null;render();await trackWeather();return}if(action==='pin-track'){await pinTrack();return}if(action==='snapshot'){snapshot();return}if(action==='restore'){restore(b.dataset.id);return}if(action==='close-modal'){modal=null;render();return}if(action==='export'){exportData();return}if(action==='import'){$('#importfile')?.click();return}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-card-lap]')){e.preventDefault();timerAction('lap',Number(e.target.dataset.cardLap));}});
document.addEventListener('change',async e=>{const inp=e.target;if(inp.dataset.autogps!==undefined){state.autoGps=inp.checked;save();if(state.autoGps)gpsWeather();return}if(inp.dataset.choice==='track'){state.track=inp.value;state.trackState='sec';save();render();return}if(inp.dataset.check){const [area,field]=inp.dataset.check.split('.');current()[area][field]=inp.checked;if(field==='spacersLinked'&&inp.checked)current()[area].frontSpacersR=current()[area].frontSpacersL;changed();render();return}if(inp.dataset.input){const path=inp.dataset.input.split('.');let val=inp.value;if(inp.type==='number'&&val!==''){val=Number(val);if(!Number.isFinite(val)){notify('Valeur incorrecte');return}}if(path[0]==='setup'&&path[1]==='rearWidth'&&Number(val)>140){val=140;inp.value='140';notify('Largeur arrière limitée à 140 cm dans ton profil')}if(path[0]==='tires'&&path.length===3){current().tires[path[1]][path[2]]=val}else{current()[path[0]][path[1]]=val}changed();return}
if(inp.dataset.pilot){const [i,f]=inp.dataset.pilot.split('.');state.pilots[Number(i)][f]=inp.value;save();return}
if(inp.id==='importfile'&&inp.files?.length){try{const text=await inp.files[0].text();const obj=JSON.parse(text);if(!obj||!obj.circuits||!Array.isArray(obj.pilots)||!obj.track)throw new Error('Format invalide');if(!confirm('Importer ce fichier remplacera les réglages actuels du prototype. Continuer ?'))return;state={...clone(DEFAULTS),...obj};CIRCUITS.forEach(initTrack);save();modal=null;navigate('home');notify('Sauvegarde importée')}catch(err){notify('Impossible d’importer ce fichier JSON')}}});
// v2.3: four large touch targets, predictive bottom-right rotation, offline storage; no unverified jet-size calculation.
render();
if(state.autoGps){setTimeout(()=>gpsWeather(),500)}
})();
}
</script>
